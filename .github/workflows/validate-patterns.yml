name: Validate detection patterns

on:
  push:
    branches: [main]
    paths:
      - "rails-upgrade/**/*.md"
      - "rails-upgrade/detection-scripts/patterns/*.yml"
      - "rails-upgrade/detection-scripts/*.rb"
      - "upgrade-cleanup/**/*.md"
      - "upgrade-cleanup/.claude-plugin/plugin.json"
      - ".claude-plugin/plugin.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "docs/harness-compatibility.md"
      - "bin/test-harness-compatibility"
      - "bin/validate-patterns"
      - "bin/test-patterns"
      - "bin/lint-skill"
      - ".github/workflows/validate-patterns.yml"
  pull_request:
    paths:
      - "rails-upgrade/**/*.md"
      - "rails-upgrade/detection-scripts/patterns/*.yml"
      - "rails-upgrade/detection-scripts/*.rb"
      - "upgrade-cleanup/**/*.md"
      - "upgrade-cleanup/.claude-plugin/plugin.json"
      - ".claude-plugin/plugin.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "docs/harness-compatibility.md"
      - "bin/test-harness-compatibility"
      - "bin/validate-patterns"
      - "bin/test-patterns"
      - "bin/lint-skill"
      - ".github/workflows/validate-patterns.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby bin/validate-patterns
      - run: ruby bin/validate-patterns --self-test
      - run: ruby bin/test-patterns
      - run: ruby bin/test-patterns --self-test
      - run: ruby bin/lint-skill
      - run: ruby rails-upgrade/detection-scripts/scan_patterns.rb --self-test
      - run: ruby rails-upgrade/detection-scripts/gem_limits.rb --self-test
      - run: ruby bin/test-harness-compatibility
